[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "openai>=3.29.0",
    "prompt-toolkit>=3.0.53",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[project.scripts]
myagent = "myagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
